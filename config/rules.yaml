# Document Classification Rules (v2.0)
# FOCUSED: Invoices and Receipts Only - EXACT MATCH
#
# v2.0 BEHAVIOR:
# - Rules are applied to EMAIL SUBJECT and BODY (not attachment content)
# - EXACT MATCH ONLY: Must contain the exact keywords (case-insensitive)
# - No fuzzy matching or approximations
# - If email matches and has attachments, all attachments are saved
#
# EXACT KEYWORDS REQUIRED:
# - Invoices: invoice, fatura, factura
# - Receipts: receipt, recibo

invoices:
  display_name: "Invoices"
  keywords:
    # EXACT matches required (case-insensitive, whole word)
    - invoice    # English
    - fatura     # Portuguese
    - factura    # Portuguese/Spanish alternative
  patterns: []   # No patterns - exact keyword match only
  entities: []   # No NLP - exact keyword match only
  confidence_boost: 0.0

receipts:
  display_name: "Receipts"
  keywords:
    # EXACT matches required (case-insensitive, whole word)
    - receipt    # English
    - recibo     # Portuguese
  patterns: []   # No patterns - exact keyword match only
  entities: []   # No NLP - exact keyword match only
  confidence_boost: 0.0
