# Financial Document Classification Rules
# ONLY INVOICES - Optimized for invoice detection only

invoices:
  display_name: "Invoices"
  keywords:
    - fatura
    - invoice
    - bill
    - nota fiscal
    - NIF
    - NIPC
    - total a pagar
    - total to pay
    - valor total
    - total amount
    - total due
    - amount due
    - IVA
    - VAT
    - subtotal
    - montante
    - factura
    - facture
  entities:
    - MONEY
    - ORG
    - DATE
  patterns:
    - "Fatura\\s+N[ºo.:]?\\s*\\d+"
    - "Invoice\\s+#?\\d+"
    - "Factura\\s+N[ºo.:]?\\s*\\d+"
    - "NIF\\s*:?\\s*\\d{9}"
    - "NIPC\\s*:?\\s*\\d{9}"
    - "Total\\s*:?\\s*[€$£]?\\s*\\d+[.,]\\d{2}"
    - "IVA\\s*[(:)]?\\s*\\d+%"
    - "VAT\\s*[(:)]?\\s*\\d+%"
    - "Subtotal\\s*:?\\s*[€$£]?\\s*\\d+[.,]\\d{2}"
    - "Tax\\s+ID\\s*:?\\s*\\d{9}"
  file_extensions:
    - .pdf
  confidence_boost: 0.15
